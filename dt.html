<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>description list and nested lists</title>
</head>
<body style="
background-image: url('https://images.pexels.com/photos/37280078/pexels-photo-37280078.jpeg');
background-size: cover;
background-repeat: no-repeat;
">
    <dl>
       <dt>HTML</dt>
       <dd>HyperText Markup Language</dd>
       <dt>CSS</dt>
         <dd>Cascading Style Sheet</dd>
    </dl>

    <ol>
        <li>fruits</li>
        <ul>
            <li>apple</li>
            <li>banana</li>
            <li>grapes</li>

        </ul>
        <li>vegetables</li>
        <ul>
            <li>carrot</li>
            <li>onion</li>
            <li>tomato</li>
        </ul>
    </ol>
</body>
</html>
